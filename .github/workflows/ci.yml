name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install lua (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          sudo update-alternatives --install /usr/bin/lua lua /usr/bin/lua5.4 10 || true

      - name: Install lua (macOS)
        if: runner.os == 'macOS'
        run: brew install --quiet lua

      - uses: jdx/mise-action@v2

      - run: mise run check
